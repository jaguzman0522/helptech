services:
  api:
    build: ./helpdesk-backend
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./helpdesk-backend:/app
    env_file:
      - ./helpdesk-backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./helpdesk-backend
    command: celery -A app.tasks worker --loglevel=info
    volumes:
      - ./helpdesk-backend:/app
    env_file:
      - ./helpdesk-backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: ./helpdesk-backend
    command: celery -A app.tasks beat --loglevel=info
    volumes:
      - ./helpdesk-backend:/app
    env_file:
      - ./helpdesk-backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk_secret}
      POSTGRES_DB: ${DB_NAME:-helpdesk}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  frontend:
    build: ./helpdesk-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./helpdesk-frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
